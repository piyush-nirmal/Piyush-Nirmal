<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
  <title id="t">Piyush Nirmal</title>
  <desc id="d">Data analyst, Python developer and SaaS builder. Scattered data points settle into a rising trend line, then scatter again.</desc>
  <style>
    .bg    { fill: #17142B; stroke: #2E2958; stroke-width: 1.5; }
    .name  { font: 700 64px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; letter-spacing: -2px; fill: #F4F1FF; }
    .role  { font: 400 21px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #B9B3E0; opacity: 0; animation: show 9s ease-in-out infinite both; }
    .r2    { animation-delay: 3s; }
    .r3    { animation-delay: 6s; }
    .grid  { stroke: #2A2550; stroke-width: 1; }
    .axis  { stroke: #4B4585; stroke-width: 1.25; }
    .cap   { font: 400 14px "Avenir Next", "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #8F89BD; opacity: 0; }
    .raw   { animation: capRaw 9s ease-in-out infinite both; }
    .clean { animation: capClean 9s ease-in-out infinite both; }
    .dot   { fill: #6E6A99; animation: settle 9s ease-in-out infinite both; }
    .line  { fill: none; stroke: url(#g); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; animation: lineShow 9s ease-in-out infinite both; }
    .area  { fill: url(#g); opacity: 0; animation: areaShow 9s ease-in-out infinite both; }
    .peak  { fill: #FFB86B; opacity: 0; animation: lineShow 9s ease-in-out infinite both; }

    @keyframes show     { 0%{opacity:0} 4%{opacity:1} 30%{opacity:1} 34%{opacity:0} 100%{opacity:0} }
    @keyframes settle   { 0%,8%{transform:translate(var(--dx),var(--dy));fill:#6E6A99} 38%,84%{transform:translate(0,0);fill:#7DD3FC} 100%{transform:translate(var(--dx),var(--dy));fill:#6E6A99} }
    @keyframes lineShow { 0%,36%{opacity:0} 46%,82%{opacity:1} 92%,100%{opacity:0} }
    @keyframes areaShow { 0%,36%{opacity:0} 46%,82%{opacity:.14} 92%,100%{opacity:0} }
    @keyframes capRaw   { 0%,6%{opacity:0} 12%,32%{opacity:1} 38%,100%{opacity:0} }
    @keyframes capClean { 0%,40%{opacity:0} 48%,82%{opacity:1} 90%,100%{opacity:0} }

    @media (prefers-reduced-motion: reduce) {
      .role, .dot, .line, .area, .peak, .cap, .raw, .clean { animation: none; }
      .r1 { opacity: 1; }
      .dot { transform: none; fill: #7DD3FC; }
      .line, .peak { opacity: 1; }
      .area { opacity: .14; }
      .clean { opacity: 1; }
    }
  </style>
  <defs>
    <linearGradient id="g" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#7DD3FC"/>
      <stop offset="1" stop-color="#C4B5FD"/>
    </linearGradient>
  </defs>

  <rect class="bg" x="1" y="1" width="958" height="318" rx="22"/>

  <text class="name" x="52" y="150">Piyush Nirmal</text>
  <text class="role r1" x="56" y="196">Data analyst. Turns raw data into decisions.</text>
  <text class="role r2" x="56" y="196">Python developer. Automates the repetitive parts.</text>
  <text class="role r3" x="56" y="196">SaaS builder. Ships HRMS, ERP and internal tools.</text>

  <line class="grid" x1="520" y1="90"  x2="920" y2="90"/>
  <line class="grid" x1="520" y1="140" x2="920" y2="140"/>
  <line class="grid" x1="520" y1="190" x2="920" y2="190"/>
  <line class="axis" x1="520" y1="250" x2="920" y2="250"/>
  <line class="axis" x1="520" y1="62"  x2="520" y2="250"/>

  <polygon class="area" points="540,250 540,218 570,208 600,213 630,190 660,178 690,184 720,152 750,140 780,146 810,114 840,100 870,92 900,78 900,250"/>
  <polyline class="line" points="540,218 570,208 600,213 630,190 660,178 690,184 720,152 750,140 780,146 810,114 840,100 870,92 900,78"/>
  <circle class="dot" cx="540" cy="218" r="4.5" style="--dx:-15px;--dy:-42px;animation-delay:0.0s"/>
  <circle class="dot" cx="570" cy="208" r="4.5" style="--dx:-10px;--dy:-68px;animation-delay:0.05s"/>
  <circle class="dot" cx="600" cy="213" r="4.5" style="--dx:-51px;--dy:-56px;animation-delay:0.1s"/>
  <circle class="dot" cx="630" cy="190" r="4.5" style="--dx:-14px;--dy:-66px;animation-delay:0.15s"/>
  <circle class="dot" cx="660" cy="178" r="4.5" style="--dx:56px;--dy:49px;animation-delay:0.2s"/>
  <circle class="dot" cx="690" cy="184" r="4.5" style="--dx:-33px;--dy:-71px;animation-delay:0.25s"/>
  <circle class="dot" cx="720" cy="152" r="4.5" style="--dx:-49px;--dy:31px;animation-delay:0.3s"/>
  <circle class="dot" cx="750" cy="140" r="4.5" style="--dx:-7px;--dy:-63px;animation-delay:0.35s"/>
  <circle class="dot" cx="780" cy="146" r="4.5" style="--dx:-30px;--dy:-57px;animation-delay:0.4s"/>
  <circle class="dot" cx="810" cy="114" r="4.5" style="--dx:10px;--dy:28px;animation-delay:0.45s"/>
  <circle class="dot" cx="840" cy="100" r="4.5" style="--dx:-53px;--dy:-40px;animation-delay:0.5s"/>
  <circle class="dot" cx="870" cy="92" r="4.5" style="--dx:-32px;--dy:-32px;animation-delay:0.55s"/>
  <circle class="dot" cx="900" cy="78" r="4.5" style="--dx:13px;--dy:40px;animation-delay:0.6s"/>
  <circle class="peak" cx="900" cy="78" r="7"/>

  <text class="cap raw"   x="526" y="276">raw data</text>
  <text class="cap clean" x="526" y="276">cleaned and modeled</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
